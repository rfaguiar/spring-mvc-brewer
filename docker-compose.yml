networks:
  brewer-network:
    driver: bridge

services:
  brewer-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rfaguiar/brewer:latest
    container_name: brewer-app
    ports:
      - "8080:8080"
      - "8000:8000"
    networks:
      - brewer-network
    environment:
      - JAVA_OPTS=-Dspring.profiles.active=docker-desenv
      - JDBC_URL=jdbc:mysql://db-mysql:3306/brewer?useSSL=false
      - JDBC_USER=root
      - JDBC_PASS=root
    depends_on:
      db-mysql:
        condition: service_healthy

  db-mysql:
    image: mysql:5.6
    container_name: db-mysql
    ports:
      - "3306:3306"
    networks:
      brewer-network:
        aliases:
          - mysql56
          - mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=brewer
    volumes:
      - ./src/main/resources/db/migration:/docker-entrypoint-initdb.d:ro
      - brewer-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  brewer-db-data: